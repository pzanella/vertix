name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo/wasm build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      # jetli/wasm-pack-action is unmaintained (stuck on the Node 16
      # runtime, no newer release) — installing the prebuilt binary
      # straight from wasm-pack's own installer script avoids that
      # dependency entirely, same source linked from this repo's README.
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build:wasm
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
