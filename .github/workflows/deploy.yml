name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo/wasm build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      # jetli/wasm-pack-action is unmaintained (stuck on the Node 16
      # runtime, no newer release) — installing the prebuilt binary
      # straight from wasm-pack's own installer script avoids that
      # dependency entirely, same source linked from this repo's README.
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build:wasm
      # --base matches this repo's GitHub Pages project-site path
      # (https://<owner>.github.io/vertix/) — Vite needs it so every
      # bundled asset URL resolves under that subpath instead of the
      # domain root. `npm run build --` still runs `tsc -b` first, same
      # as the verify workflow, so a type error fails this too.
      - run: npm run build -- --base=/vertix/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
